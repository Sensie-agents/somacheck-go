<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>World Vibe - SomaCheck</title>
  <meta name="description" content="Check in on this World Vibe item with the 3-second wrist check in SomaCheck.">
  <meta property="og:title" content="World Vibe - SomaCheck">
  <meta property="og:description" content="Check in on this World Vibe item with the 3-second wrist check in SomaCheck.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/world-vibe/share/topic.css">
  <style>
    .source-line { color: var(--faint); font-size: .92rem; margin: 0 0 18px; }
    .source-line a { color: var(--emerald-text); }
    /* Vibe indicator: a single glanceable graphic shared with the feed cards
       (world-vibe/index.html). All three privacy phases render as the same
       ring (progress ring, lean ring with a fixed-position marker, two-tone
       split ring) instead of changing precision, and always carry a
       plain-word caption as its text alternative. */
    .vibe-indicator { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 0 0 18px; text-align: left; }
    .vibe-ring { flex: 0 0 auto; overflow: visible; }
    .vibe-ring-track { fill: none; stroke: var(--border); stroke-width: 7; }
    .vibe-ring-arc { fill: none; stroke-width: 7; }
    .vibe-ring-arc-progress { stroke: var(--emerald); stroke-linecap: round; }
    .vibe-ring-arc-aligned { stroke: var(--emerald); }
    .vibe-ring-arc-unaligned { stroke: var(--amber); stroke-dasharray: 3 4; }
    .vibe-ring-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-size: 13px; font-weight: 700; fill: var(--ink); }
    .vibe-ring-arc-lean { stroke-linecap: round; }
    .vibe-ring-arc-lean-aligned { stroke: var(--emerald); }
    .vibe-ring-arc-lean-unaligned { stroke: var(--amber); }
    .vibe-ring-arc-lean-mixed { stroke: var(--muted); }
    .vibe-caption-main { font-weight: 700; color: var(--ink); font-size: .95rem; }
    .vibe-caption-sub { color: var(--faint); font-size: .8rem; margin-top: 2px; }
    /* topic.css's .button sets its own display, which otherwise beats the
       browser's default [hidden] styling at equal selector specificity. */
    .button[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">SomaCheck</div>
    <h1>World Vibe</h1>
    <blockquote id="item-quote">Loading this item...</blockquote>
    <div class="progress" id="progress" aria-live="polite"></div>
    <p id="item-statement" class="qr-caption"></p>
    <p class="source-line" id="source-line" hidden>Source: <a id="source-link" href="#" target="_blank" rel="noopener noreferrer"></a></p>
    <div class="actions">
      <button class="button button-primary" id="start-check-in" type="button" hidden>Check in on your phone</button>
    </div>
    <p class="status" id="status" aria-live="polite">Loading...</p>
    <p class="privacy">Your identity is not shown. Results appear only in aggregate.</p>
    <p class="footer"><a href="/world-vibe/">Explore World Vibe</a> · <a href="/privacy">Privacy</a></p>
  </main>
  <script src="/world-vibe/config.js"></script>
  <script src="/world-vibe/share/item.js" defer></script>
</body>
</html>
