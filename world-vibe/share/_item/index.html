    .source-line { color: var(--faint); font-size: .92rem; margin: 0 0 18px; }

    .aggregate-label { color: var(--muted); font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }

       browser's default [hidden] styling at equal selector specificity. */
    .button[hidden] { display: none; }
