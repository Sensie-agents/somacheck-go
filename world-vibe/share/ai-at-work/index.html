  <style>
    :root { --bg:#FBF6EE; --ink:#261D16; --muted:#405340; --emerald:#12A594; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0a0b0d; --ink:#e8ecef; --muted:#8a9499; } }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100dvh; text-align:center; }
    .card { max-width:520px; padding:40px 24px; }
    a { color:var(--emerald); }
    p { color:var(--muted); line-height:1.5; }
    .spinner { display:inline-block; width:20px; height:20px; border:2px solid var(--emerald); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <p>Preparing your check-in...</p>
  </div>
  <script>
    (function() {
      var STATEMENT_API_URL = 'https://pbldcmniommltbdwuykk.supabase.co/functions/v1/statement-api';
      var topic = "ai-at-work";
      var shareUrl = 'https://go.somacheck.com/world-vibe/share/ai-at-work';
      var card = document.getElementById('card');

      function setError(message, sub) {
        card.innerHTML = '<p><strong>' + escapeHtml(message) + '</strong></p>' + (sub ? '<p>' + escapeHtml(sub) + '</p>' : '');
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function redirectTo(url) {
        var meta = document.createElement('meta');
        meta.httpEquiv = 'refresh';
        meta.content = '0; url=' + url;
        document.head.appendChild(meta);
        card.innerHTML = '<p>Redirecting to your check-in...</p><p><a href="' + escapeHtml(url) + '">Open World Vibe</a></p>';
        window.location.href = url;
      }

      fetch(STATEMENT_API_URL + '/v0/public/topics/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic: topic })
      }).then(function(r) {
        if (r.status === 404) {
          setError('This topic has been retired.', 'Pick a live topic at ' + shareUrl.replace('/share/' + topic, ''));
          return;
        }
        if (r.status === 429) {
          setError('the world is busy today, come back tomorrow');
          return;
        }
        if (!r.ok) {
          setError('Something went wrong. Please try again.');
          return;
        }
        return r.json().then(function(data) {
          if (data && data.link_url) {
            redirectTo(data.link_url);
          } else {
            setError('Something went wrong. Please try again.');
          }
        });
      }).catch(function() {
        setError('Something went wrong. Please try again.');
      });
    })();
  </script>
</body>
