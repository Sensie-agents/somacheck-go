<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Confirming your SomaCheck account…</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0e14;
      --surface: #131820;
      --text: #ffffff;
      --muted: #a8b0bd;
      --teal: #6fd2c8;
      --pink: #f2789f;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    p {
      margin: 8px 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(111, 210, 200, 0.15);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .open-app {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: var(--teal);
      color: var(--bg);
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
    }
    .error { color: var(--pink); }
    .small { font-size: 13px; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Confirming your account…</h1>
    <p id="message">Returning you to the SomaCheck app.</p>
    <a id="open-app" class="open-app" style="display: none">Open SomaCheck</a>
    <p id="fallback" class="small" style="display: none">
      If the app didn't open automatically, tap the button above. Make sure SomaCheck is installed on this device.
    </p>
  </div>

  <script>
    (function () {
      // Supabase Swift uses PKCE and returns ?code=...; older implicit links
      // return tokens in the hash. Forward either form unchanged to the native
      // client, which owns the PKCE verifier and performs the exchange.
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      var openBtn = document.getElementById('open-app');
      var fallback = document.getElementById('fallback');
      var spinner = document.getElementById('spinner');

      function showError(text) {
        spinner.style.display = 'none';
        title.textContent = 'We hit a snag';
        title.classList.add('error');
        message.textContent = text;
      }

      // Error path: Supabase appends ?error=...&error_description=...
      var queryParams = new URLSearchParams(search.substring(1));
      if (queryParams.has('error')) {
        var desc = queryParams.get('error_description') || queryParams.get('error') || 'Unknown error';
        showError(decodeURIComponent(desc).replace(/\+/g, ' '));
        return;
      }

      // Empty link — no PKCE code, tokens, or error. Usually means the user opened
      // /auth/callback directly without clicking an email link, or the email
      // client stripped the fragment. Don't silently try to deeplink with
      // nothing — show a clear message instead.
      var hashParams = new URLSearchParams(hash.replace(/^#/, ''));
      var hasPKCECode = !!queryParams.get('code');
      var hasImplicitTokens = !!hashParams.get('access_token') && !!hashParams.get('refresh_token');
      if (!hasPKCECode && !hasImplicitTokens) {
        showError('This link looks incomplete. Try clicking the confirmation link in your email again, or request a new one from the app.');
        return;
      }

      // Success path: deeplink back into the app with the original PKCE query
      // or legacy implicit fragment.
      var deeplink = 'somacheck://auth/callback' + (hasPKCECode ? search : hash);
      openBtn.href = deeplink;
      openBtn.style.display = 'inline-block';
      fallback.style.display = 'block';

      // Auto-redirect via location change (works on iOS Safari).
      // Slight delay so the page renders first; otherwise the device sometimes
      // blocks the navigation as an unsolicited deeplink.
      setTimeout(function () {
        window.location.href = deeplink;
      }, 250);
    })();
  </script>
</body>
</html>
